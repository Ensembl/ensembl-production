[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "wheel",
]

[project]
name = "ensembl-production"
description = "Ensembl Production Tools and Utilities"
requires-python = ">= 3.10"
dynamic = ["version", "readme"]
authors = [
    { name = "Ensembl Automation Team", email = "ensembl-developers@ebi.ac.uk" },
]
license = {text = "Apache License 2.0"}
keywords = [
    "ensembl",
    "production",
    "bioinformatics",
    "genomics",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests >= 2.25.0, < 3",
    "pydantic >= 1.10.5",
    "ensembl-py >= 3.0.1",
    "ensembl-utils >= 0.8",
    "ensembl-metadata-api @ git+https://github.com/Ensembl/ensembl-metadata-api.git",
    "wget >= 3.2",
    "unidecode >= 1.4.0",
    "biopython >= 1.85",
]

[project.urls]
Homepage = "https://www.ensembl.org"
Repository = "https://github.com/Ensembl/ensembl-production"
Issues = "https://github.com/Ensembl/ensembl-production/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "mock",
    "pytest-env",
    "pymysql",
]
dev = [
    "ensembl-production[test]",  # Include test dependencies
    "black",
    "pylint",
    "mypy",
]

[project.scripts]
dc-parser = "scripts.dcparse:main"
dc-stat = "scripts.dcstat:main"
meta-hive-species = "scripts.meta_hive_species:main"

[tool.setuptools]
package-dir = {"" = "src/python"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
readme = { file = ["README.md"] }

[tool.black]
line-length = 110

[tool.pylint.main]
max-line-length = 110
disable = [
    "invalid-name",
    "logging-fstring-interpolation",
    "similarities",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "unspecified-encoding",
    "wildcard-import",
]

[tool.mypy]
mypy_path = "src/python"
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["src/python/tests"]
log_cli_level = "DEBUG"
addopts = [
    "--import-mode=importlib",
    "--tb=native",
]
norecursedirs = ["docs", "*.egg_info"]

[tool.coverage.report]
exclude_also = [
    # Do not complain about missing debug-only code
    "def __repr__",
    "if self\\.debug",
    "if settings\\.DEBUG",
    # Do not complain if tests do not hit defensive assertion code
    "raise AssertionError",
    "raise NotImplementedError",
    # Do not complain if non-runnable code is not run
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def main",
    "def .*_cli",
    # Do not complain about abstract methods, they are not run
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.run]
source = ["src/python"]
